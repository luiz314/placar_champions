<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Placar de Vôlei Online</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏐</text></svg>">
</head>
<body>

  <!-- BARRA SUPERIOR COM MENU E CRONÔMETRO -->
  <header class="app-header">
    <div class="header-top-row">
      <div class="title-area">
        <span style="font-size: 1.5rem;">🏐</span>
        <h1 class="app-title">Placar de Vôlei</h1>
      </div>

      <!-- MENU SUPERIOR -->
      <div class="menu-container">
        <button class="btn btn-menu" id="btnMenuToggle" title="Abrir Menu">
          <span>☰</span>
          <span>Menu</span>
        </button>

        <div class="menu-dropdown" id="menuDropdown">
          <button class="menu-item" id="menuItemHistory">
            <span class="menu-item-icon">📜</span>
            <span class="menu-item-text">Histórico das Partidas</span>
            <span class="menu-badge" id="menuHistoryBadge">0</span>
          </button>
          <button class="menu-item" id="menuItemMute">
            <span class="menu-item-icon" id="menuMuteIcon">🔊</span>
            <span class="menu-item-text" id="menuMuteText">Som: Ativado</span>
          </button>
          <button class="menu-item" id="menuItemFullscreen">
            <span class="menu-item-icon" id="menuFullscreenIcon">⛶</span>
            <span class="menu-item-text" id="menuFullscreenText">Tela Cheia</span>
          </button>
        </div>
      </div>
    </div>

    <!-- CRONÔMETRO CENTRAL E CONTROLES DE PARTIDA -->
    <div class="timer-container">
      <div class="timer-box">
        <span class="timer-dot" id="timerDot"></span>
        <div class="timer-display" id="timerDisplay">00:00</div>
      </div>

      <div class="timer-controls">
        <button class="btn btn-timer-toggle" id="btnTimerToggle" title="Iniciar/Pausar (Toca apito ao iniciar)">
          <span id="timerToggleIcon">▶</span>
          <span id="timerToggleText">Iniciar</span>
        </button>
        <button class="btn" id="btnTimerRestart" title="Zerar e reiniciar o cronômetro">
          <span>↺ Reiniciar</span>
        </button>
        <button class="btn btn-finish-match" id="btnFinishMatch" title="Salvar resultado e iniciar nova partida">
          <span>🏁 Encerrar Partida</span>
        </button>
        <button class="btn btn-reset-match" id="btnScoreReset" title="Zerar os pontos das duas equipes">
          <span>⚠️ Zerar Placar</span>
        </button>
      </div>
    </div>
  </header>

  <!-- CORPO PRINCIPAL DO PLACAR (VISUAL 100% LIMPO) -->
  <main class="scoreboard-main">
    <div class="scoreboard-grid">

      <!-- LADO A (AZUL) -->
      <section class="team-card team-a">
        <input type="text" id="nameA" class="team-title-input" value="LADO A" maxlength="20" title="Clique para editar o nome">
        
        <div class="score-number-box" id="clickAreaA" title="Clique para +1 Ponto">
          <span class="score-digit" id="scoreDigitA">0</span>
        </div>

        <div class="team-btn-group">
          <button class="btn-point-add" id="btnAddA">
            <span>▲ +1 PONTO</span>
          </button>
          <button class="btn-point-sub" id="btnSubA">
            <span>▼ -1 Ponto</span>
          </button>
        </div>
      </section>

      <!-- DIVISOR VERSUS -->
      <div class="versus-divider">
        <div class="versus-line"></div>
        <span>VS</span>
        <div class="versus-line"></div>
      </div>

      <!-- LADO B (VERMELHO) -->
      <section class="team-card team-b">
        <input type="text" id="nameB" class="team-title-input" value="LADO B" maxlength="20" title="Clique para editar o nome">
        
        <div class="score-number-box" id="clickAreaB" title="Clique para +1 Ponto">
          <span class="score-digit" id="scoreDigitB">0</span>
        </div>

        <div class="team-btn-group">
          <button class="btn-point-add" id="btnAddB">
            <span>▲ +1 PONTO</span>
          </button>
          <button class="btn-point-sub" id="btnSubB">
            <span>▼ -1 Ponto</span>
          </button>
        </div>
      </section>

    </div>
  </main>

  <!-- MODAL DE HISTÓRICO DE PARTIDAS (ABERTO PELO MENU) -->
  <div class="modal-backdrop" id="historyModalBackdrop">
    <div class="history-modal">
      <div class="history-modal-header">
        <div class="history-modal-title">
          <span>📜 Histórico de Partidas</span>
          <span class="history-modal-badge" id="historyCountBadge">0</span>
        </div>
        <div style="display: flex; gap: 10px; align-items: center;">
          <button class="btn-clear-history" id="btnClearHistory" title="Limpar todo o histórico">Limpar Histórico</button>
          <button class="btn-close-modal" id="btnCloseHistoryModal" title="Fechar">&times;</button>
        </div>
      </div>
      <div class="history-modal-body">
        <div class="history-list" id="historyList">
          <div class="history-empty">Nenhuma partida finalizada ainda. Use "Encerrar Partida" para salvar o placar atual.</div>
        </div>
      </div>
    </div>
  </div>

  <!-- RODAPÉ COM ATALHOS -->
  <footer class="app-footer">
    <span><span class="kbd-badge">1</span> ou <span class="kbd-badge">A</span>: +1 Ponto Lado A</span>
    <span><span class="kbd-badge">2</span> ou <span class="kbd-badge">B</span>: +1 Ponto Lado B</span>
    <span><span class="kbd-badge">Espaço</span>: Iniciar/Pausar Cronômetro (Apito)</span>
    <span><span class="kbd-badge">F</span>: Tela Cheia</span>
    <span><span class="kbd-badge">H</span>: Ver Histórico</span>
  </footer>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/audio.js"></script>
  <script src="/js/scoreboard.js"></script>
</body>
</html>
