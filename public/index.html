<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Placar de Vôlei Online</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏐</text></svg>">
</head>
<body>

  <!-- BARRA SUPERIOR COM CRONÔMETRO E CONTROLES GERAIS -->
  <header class="app-header">
    <div class="title-area">
      <span style="font-size: 1.5rem;">🏐</span>
      <h1 class="app-title">Placar de Vôlei</h1>
    </div>

    <div class="timer-container">
      <div class="timer-box">
        <span class="timer-dot" id="timerDot"></span>
        <div class="timer-display" id="timerDisplay">00:00</div>
      </div>

      <div class="timer-controls">
        <button class="btn btn-timer-toggle" id="btnTimerToggle" title="Iniciar/Pausar (Toca apito ao iniciar)">
          <span id="timerToggleIcon">▶</span>
          <span id="timerToggleText">Iniciar</span>
        </button>
        <button class="btn" id="btnTimerRestart" title="Zerar e reiniciar o cronômetro">
          <span>↺ Reiniciar</span>
        </button>
        <button class="btn btn-finish-match" id="btnFinishMatch" title="Salvar resultado e iniciar nova partida">
          <span>🏁 Encerrar Partida</span>
        </button>
        <button class="btn btn-reset-match" id="btnScoreReset" title="Zerar os pontos das duas equipes">
          <span>⚠️ Zerar Placar</span>
        </button>
      </div>
    </div>
  </header>

  <!-- CORPO PRINCIPAL DO PLACAR -->
  <main class="scoreboard-main">
    <div class="scoreboard-grid">

      <!-- LADO A (AZUL) -->
      <section class="team-card team-a">
        <input type="text" id="nameA" class="team-title-input" value="LADO A" maxlength="20" title="Clique para editar o nome">
        
        <div class="score-number-box" id="clickAreaA" title="Clique para +1 Ponto">
          <span class="score-digit" id="scoreDigitA">0</span>
        </div>

        <div class="team-btn-group">
          <button class="btn-point-add" id="btnAddA">
            <span>▲ +1 PONTO</span>
          </button>
          <button class="btn-point-sub" id="btnSubA">
            <span>▼ -1 Ponto</span>
          </button>
        </div>
      </section>

      <!-- DIVISOR VERSUS -->
      <div class="versus-divider">
        <div class="versus-line"></div>
        <span>VS</span>
        <div class="versus-line"></div>
      </div>

      <!-- LADO B (VERMELHO) -->
      <section class="team-card team-b">
        <input type="text" id="nameB" class="team-title-input" value="LADO B" maxlength="20" title="Clique para editar o nome">
        
        <div class="score-number-box" id="clickAreaB" title="Clique para +1 Ponto">
          <span class="score-digit" id="scoreDigitB">0</span>
        </div>

        <div class="team-btn-group">
          <button class="btn-point-add" id="btnAddB">
            <span>▲ +1 PONTO</span>
          </button>
          <button class="btn-point-sub" id="btnSubB">
            <span>▼ -1 Ponto</span>
          </button>
        </div>
      </section>

    </div>
  </main>

  <!-- SEÇÃO DE HISTÓRICO DE PARTIDAS -->
  <section class="history-section">
    <div class="history-card-box">
      <div class="history-header">
        <div class="history-title">
          <span>📜 Histórico de Partidas</span>
          <span id="historyCountBadge">0</span>
        </div>
        <button class="btn-clear-history" id="btnClearHistory" title="Limpar todo o histórico">Limpar Histórico</button>
      </div>
      <div class="history-list" id="historyList">
        <div class="history-empty">Nenhuma partida finalizada ainda. Use "Encerrar Partida" para salvar o placar atual.</div>
      </div>
    </div>
  </section>

  <!-- RODAPÉ COM ATALHOS -->
  <footer class="app-footer">
    <span><span class="kbd-badge">1</span> ou <span class="kbd-badge">A</span>: +1 Ponto Lado A</span>
    <span><span class="kbd-badge">2</span> ou <span class="kbd-badge">B</span>: +1 Ponto Lado B</span>
    <span><span class="kbd-badge">Espaço</span>: Iniciar/Pausar Cronômetro (Apito)</span>
  </footer>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/audio.js"></script>
  <script src="/js/scoreboard.js"></script>
</body>
</html>
